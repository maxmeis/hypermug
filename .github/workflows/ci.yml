name: CI

# The squash commit uses the PR title, so validate that title on every edit.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from the complete change range
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 helpers/ci_scope.py --event "$EVENT" --base "$BASE" --head "$HEAD"
  ci:
    needs: changes
    # Run even if selection fails: required ci must fail, not silently skip.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.native == 'false' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 20
    steps:
      - name: Require successful check selection
        env:
          RESULT: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.native }}
        run: test "$RESULT" = success && { test "$NATIVE" = true || test "$NATIVE" = false; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json # reads the `volta.node` pin
          cache: npm

      - run: HUSKY=0 make ci-tools

      - name: Layer rules
        run: make check-layers

      - name: Release metadata and workflow checks
        run: |
          make test-ci
          make test-dev-signing
          make test-release
          make test-release-queue
          make check-shell

      - name: Issue automation and content checks
        run: |
          make check-automation
          make check-website

      - name: Core tests and 100% coverage gate
        if: needs.changes.outputs.native == 'true'
        run: make test

      - name: Native subprocess supervision checks
        if: needs.changes.outputs.native == 'true'
        run: make test-runtime

      - name: Compile check (Core module, Platform + App type-check)
        if: needs.changes.outputs.native == 'true'
        run: make compile-check

      - name: Build Dev bundle and verify icon, Sparkle framework and no update feed
        if: needs.changes.outputs.native == 'true'
        run: |
          SIGN_ID=- make dev
          app="build/HyperMug Dev.app"
          test "$(plutil -extract CFBundleIconFile raw -o - "$app/Contents/Info.plist")" = HyperMug.icns
          test "$(plutil -extract HyperMugReleaseChannel raw -o - "$app/Contents/Info.plist")" = local
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = 0.1.0
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Contents/Info.plist")" = 1
          ! plutil -extract SUFeedURL raw -o - "$app/Contents/Info.plist" >/dev/null 2>&1
          test -L "$app/Contents/Frameworks/Sparkle.framework/Versions/Current"
          test -L "$app/Contents/Frameworks/Sparkle.framework/Sparkle"
          test -s "$app/Contents/Resources/HyperMug.icns"
          python3 helpers/check-bundle-schema.py "$app"
          codesign --verify --deep --strict "$app"

      - name: Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PR_TITLE" | npx --no-install commitlint
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eiq '\[(skip ci|ci skip|no ci|skip actions|actions skip|skip release)\]|^skip-checks:[[:space:]]*true'; then
            echo 'Remove CI/release skip directives from the squash commit title or body' >&2
            exit 1
          fi

      - name: Commit messages (branch)
        if: github.event_name == 'workflow_dispatch'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          from="$BEFORE"
          # New branch (all-zero sha) or a force-push over a commit this clone does not have:
          # lint everything since the default branch instead. A release-casks/* candidate is
          # rebuilt on the current default branch, so its previous tip can predate commits that
          # are already on the default branch; lint only the commits it adds on top of it.
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ] || echo "$from" | grep -qE '^0+$' || ! git cat-file -e "${from}^{commit}" 2>/dev/null; then
            from="$(git merge-base "origin/$DEFAULT_BRANCH" "$AFTER" 2>/dev/null || true)"
          fi
          if [ -z "$from" ] || [ "$(git rev-list --count "$from..$AFTER")" = 0 ]; then
            echo "No new commits to lint."
          else
            FROM="$from" TO="$AFTER" make lint-commits
          fi
