# Production release, part 2: tag, build, sign, notarize and publish the tested commit. Releases are
# serialized by the macOS agent running one workflow at a time; see docs/releases.md.
when:
  - event: push
    branch: main
    evaluate: 'CI_REPO == "maxmeis/hypermug"'
    path:
      include:
        - Source/HyperMug/**
        - Source/Branding/**
        - helpers/**
        - Makefile
        - .woodpecker/release-check.yaml
        - .woodpecker/release.yaml

depends_on:
  - release-check

labels:
  platform: darwin/arm64

steps:
  - name: select-version-and-create-source-tag
    image: bash
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      - . helpers/woodpecker-macos-env.sh gh
      - ./helpers/woodpecker-release.sh version

  - name: reuse-and-verify-existing-archive
    image: bash
    environment:
      GH_TOKEN:
        from_secret: github_token
      APPLE_TEAM_ID:
        from_secret: apple_team_id
    commands:
      - . helpers/woodpecker-macos-env.sh gh
      - ./helpers/woodpecker-release.sh existing

  - name: build-sign-and-notarize
    image: bash
    environment:
      SIGN_ID:
        from_secret: sign_id
      DEVELOPER_ID_P12_BASE64:
        from_secret: developer_id_p12_base64
      DEVELOPER_ID_P12_PASSWORD:
        from_secret: developer_id_p12_password
      APPLE_TEAM_ID:
        from_secret: apple_team_id
      APP_STORE_CONNECT_PRIVATE_KEY:
        from_secret: app_store_connect_private_key
      APP_STORE_CONNECT_KEY_ID:
        from_secret: app_store_connect_key_id
      APP_STORE_CONNECT_ISSUER_ID:
        from_secret: app_store_connect_issuer_id
    commands:
      - . helpers/woodpecker-macos-env.sh
      - ./helpers/woodpecker-release.sh build

  - name: publish-release-appcast-and-cask
    image: bash
    environment:
      APPLE_TEAM_ID:
        from_secret: apple_team_id
      GH_TOKEN:
        from_secret: github_token
      HOMEBREW_SSH_PRIVATE_KEY:
        from_secret: homebrew_ssh_private_key
      SPARKLE_ED_PRIVATE_KEY:
        from_secret: sparkle_ed_private_key
    commands:
      - . helpers/woodpecker-macos-env.sh gh
      - ./helpers/woodpecker-release.sh publish
