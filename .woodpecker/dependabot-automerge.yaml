# Approves every Dependabot PR, including major bumps, and squash-merges it once ci and ci-macos have
# passed, through GitHub auto-merge so the main rulesets still gate it. It never checks out or runs
# PR code: the commands below only call the GitHub API.
when:
  - event: pull_request
    evaluate: 'CI_COMMIT_AUTHOR == "dependabot[bot]" && CI_REPO == "maxmeis/hypermug"'

depends_on:
  - ci
  - ci-macos

labels:
  platform: linux/amd64

skip_clone: true

steps:
  - name: approve-and-enable-squash-auto-merge
    image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    environment:
      GH_TOKEN:
        from_secret: dependabot_github_token
    commands:
      - apk add --no-cache github-cli jq >/dev/null
      - api="repos/$${CI_REPO}/pulls/$${CI_COMMIT_PULL_REQUEST}"
      # Re-check what the forge says, not only the pipeline metadata.
      - test "$$(gh api "$$api" --jq .user.login)" = 'dependabot[bot]'
      - test "$$(gh api "$$api" --jq .head.sha)" = "$${CI_COMMIT_SHA}"
      # Fails unless every commit is a verified Dependabot commit, so anything pushed onto a
      # Dependabot branch by someone else is never approved or auto-merged.
      - test "$$(gh api "$$api" --jq .commits)" -gt 0
      - unverified="$$(gh api --paginate "$$api/commits" --jq '.[] | select(.author.login != "dependabot[bot]" or .commit.verification.verified != true) | .sha')"
      - test -z "$$unverified"
      - echo "Auto-merging $$(gh api "$$api" --jq .title)"
      - gh pr review --approve --body "Verified Dependabot update; merges after required checks pass." "$${CI_COMMIT_PULL_REQUEST}" --repo "$${CI_REPO}"
      - gh pr merge --auto --squash "$${CI_COMMIT_PULL_REQUEST}" --repo "$${CI_REPO}"
